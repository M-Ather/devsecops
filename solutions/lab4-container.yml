name: Lab4 - Container Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dockerfile-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Scan Dockerfile for misconfigurations
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest \
            config --severity HIGH,CRITICAL --exit-code 1 /src

  image-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t workshop-app:${{ github.sha }} .
      - name: Scan image for vulnerabilities (CRITICAL, fix available)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --severity CRITICAL --ignore-unfixed --exit-code 1 workshop-app:${{ github.sha }}
